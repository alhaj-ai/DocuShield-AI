services:
  api:
    build: .
    ports:
      - "8000:8000"
    command: python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  dashboard:
    build: .
    ports:
      - "8501:8501"
    command: python -m streamlit run src/app/dashboard.py --server.port 8501 --server.address 0.0.0.0
    restart: unless-stopped
    depends_on:
      - api
